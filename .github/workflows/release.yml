name: Build and Release

# タグ "v*"（例: v3.0）を push すると、Windows ランナー上で
# PyInstaller + Inno Setup を実行してセットアップ exe をビルドし、
# そのタグに対応する GitHub Release を作成して exe を添付する。
# これにより起動時のアップデート告知（update_checker.py）が
# 新しいリリースを検知できるようになる。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller src/simekiri_gui.py --name simekiri_gui --icon assets/icon.ico --noconfirm --clean

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\SimekiriKyokan.iss'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SimekiriKyokan ${{ github.ref_name }}
          generate_release_notes: true
          files: installer/Output/*.exe
