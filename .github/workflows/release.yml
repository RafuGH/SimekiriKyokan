name: Build and Release

# タグ "v*"（例: v3.0）を push すると、Windows ランナー上で
# PyInstaller + Inno Setup を実行してセットアップ exe をビルドし、
# そのタグに対応する GitHub Release を作成して exe を添付する。
# これにより起動時のアップデート告知（update_checker.py）が
# 新しいリリースを検知できるようになる。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "リリースするバージョン（例: 3.0）。tag v<version> を作成します"
        required: true
      notes:
        description: "リリースノート（アップデートのお知らせに表示される）。空欄なら自動生成"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller src/simekiri_gui.py --name simekiri_gui --icon assets/icon.ico --noconfirm --clean --windowed `
          --collect-data googleapiclient --collect-submodules googleapiclient `
          --collect-submodules google_auth_oauthlib `
          --hidden-import win32com.client --hidden-import pythoncom --hidden-import pywintypes

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\SimekiriKyokan.iss'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: SimekiriKyokan ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          body: ${{ github.event.inputs.notes }}
          generate_release_notes: ${{ github.event.inputs.notes == '' }}
          files: installer/Output/*.exe
